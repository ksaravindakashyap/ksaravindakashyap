name: IsoCalendar

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  isocalendar:
    runs-on: ubuntu-latest
    steps:
      - name: Generate isocalendar SVG
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ksaravindakashyap
          filename: isocalendar.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full
          config_display: large
